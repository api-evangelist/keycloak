openapi: 3.2.0
info:
  title: Keycloak Admin REST Groups API
  description: This is a REST API reference for the Keycloak Admin REST API.
  version: '1.0'
tags:
- name: Groups
paths:
  /admin/realms/{realm}/groups:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Get group hierarchy. Only `name` and `id` are returned.
      parameters:
      - name: briefRepresentation
        in: query
        schema:
          default: true
          type: boolean
      - name: exact
        in: query
        schema:
          default: 'false'
          type: boolean
      - name: first
        in: query
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        schema:
          format: int32
          type: integer
      - name: populateHierarchy
        in: query
        schema:
          default: true
          type: boolean
      - name: q
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: subGroupsCount
        in: query
        description: 'Boolean which defines whether to return the count of subgroups for each group (default: true'
        schema:
          default: 'true'
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
      operationId: getAdminRealmsByRealmGroups
      x-operation-id-source: derived
    post:
      tags:
      - Groups
      summary: create or add a top level realm groupSet or create child
      description: This will update the group and set the parent if it exists. Create it and set the parent if the group doesn’t exist.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '201':
          description: Created
        '204':
          description: No Content
        '400':
          description: Bad Request
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmGroups
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/count:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Returns the groups counts
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: top
        in: query
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  format: int64
                  type: integer
      operationId: getAdminRealmsByRealmGroupsCount
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/{group-id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRepresentation'
      summary: Get admin realms by realm groups by group id
      x-summary-source: derived
      operationId: getAdminRealmsByRealmGroupsByGroupId
      x-operation-id-source: derived
    put:
      tags:
      - Groups
      summary: Update group, ignores subgroups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '409':
          description: Conflict
      operationId: putAdminRealmsByRealmGroupsByGroupId
      x-operation-id-source: derived
    delete:
      tags:
      - Groups
      responses:
        '204':
          description: No Content
      summary: Delete admin realms by realm groups by group id
      x-summary-source: derived
      operationId: deleteAdminRealmsByRealmGroupsByGroupId
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/{group-id}/children:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Return a paginated list of subgroups that have a parent group corresponding to…
      parameters:
      - name: briefRepresentation
        in: query
        description: 'Boolean which defines whether brief groups representations are returned or not (default: false)'
        schema:
          default: 'false'
          type: boolean
      - name: exact
        in: query
        description: Boolean which defines whether the params "search" must match exactly or not
        schema:
          type: boolean
      - name: first
        in: query
        description: The position of the first result to be returned (pagination offset).
        schema:
          format: int32
          default: '0'
          type: integer
      - name: max
        in: query
        description: The maximum number of results that are to be returned. Defaults to 10
        schema:
          format: int32
          default: '10'
          type: integer
      - name: search
        in: query
        description: A String representing either an exact group name or a partial name, defaults to prefix search.
        schema:
          type: string
      - name: subGroupsCount
        in: query
        description: 'Boolean which defines whether to return the count of subgroups for each subgroup of this group (default: true)'
        schema:
          default: 'true'
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
      operationId: getAdminRealmsByRealmGroupsByGroupIdChildren
      x-operation-id-source: derived
    post:
      tags:
      - Groups
      summary: Set or create child
      description: This will just set the parent if it exists. Create it and set the parent if the group doesn’t exist.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '201':
          description: Created
        '204':
          description: No Content
        '400':
          description: Bad Request
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmGroupsByGroupIdChildren
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/{group-id}/management/permissions:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Return object stating whether client Authorization permissions have been…
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: getAdminRealmsByRealmGroupsByGroupIdManagementPermissions
      x-operation-id-source: derived
    put:
      tags:
      - Groups
      summary: Return object stating whether client Authorization permissions have been…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementPermissionReference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: putAdminRealmsByRealmGroupsByGroupIdManagementPermissions
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/{group-id}/members:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Groups
      summary: Get users Returns a stream of users, filtered according to query parameters
      parameters:
      - name: briefRepresentation
        in: query
        description: Only return basic information (only guaranteed to return id, username, created, first and last name, email, enabled state, email verification state, federation link, and access. Note that it means that namely user attributes, required actions, and not before are not returned.)
        schema:
          type: boolean
      - name: first
        in: query
        description: Pagination offset
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: Maximum results size (defaults to 100)
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRepresentation'
      operationId: getAdminRealmsByRealmGroupsByGroupIdMembers
      x-operation-id-source: derived
components:
  schemas:
    UserProfileMetadata:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileAttributeMetadata'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileAttributeGroupMetadata'
    MultivaluedHashMapStringString:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
    UserProfileAttributeMetadata:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
        required:
          type: boolean
        readOnly:
          type: boolean
        annotations:
          type: object
          additionalProperties: {}
        validators:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
        group:
          type: string
        multivalued:
          type: boolean
        defaultValue:
          type: string
    UserVerifiableCredentialRepresentation:
      type: object
      properties:
        credentialScopeName:
          type: string
        credentialConfigurationId:
          type: string
        revision:
          type: string
        createdDate:
          format: int64
          type: integer
        updatedDate:
          format: int64
          type: integer
        userAttributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    IssuedVerifiableCredentialRepresentation:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        credentialType:
          type: string
        issuedAt:
          format: int64
          type: integer
        expiresAt:
          format: int64
          type: integer
        clientId:
          type: string
        clientName:
          type: string
        clientBaseUrl:
          type: string
        revision:
          type: string
    CredentialRepresentation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        userLabel:
          type: string
        createdDate:
          format: int64
          type: integer
        secretData:
          type: string
        credentialData:
          type: string
        priority:
          format: int32
          type: integer
        value:
          type: string
        temporary:
          type: boolean
        device:
          type: string
          deprecated: true
        hashedSaltedValue:
          type: string
          deprecated: true
        salt:
          type: string
          deprecated: true
        hashIterations:
          format: int32
          type: integer
          deprecated: true
        counter:
          format: int32
          type: integer
          deprecated: true
        algorithm:
          type: string
          deprecated: true
        digits:
          format: int32
          type: integer
          deprecated: true
        period:
          format: int32
          type: integer
          deprecated: true
        config:
          type: object
          allOf:
          - $ref: '#/components/schemas/MultivaluedHashMapStringString'
          deprecated: true
        federationLink:
          type: string
    UserConsentRepresentation:
      type: object
      properties:
        clientId:
          type: string
        grantedClientScopes:
          type: array
          items:
            type: string
        createdDate:
          format: int64
          type: integer
        lastUpdatedDate:
          format: int64
          type: integer
        grantedRealmRoles:
          type: array
          items:
            type: string
          deprecated: true
    UserProfileAttributeGroupMetadata:
      type: object
      properties:
        name:
          type: string
        displayHeader:
          type: string
        displayDescription:
          type: string
        annotations:
          type: object
          additionalProperties: {}
    GroupRepresentation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        path:
          type: string
        parentId:
          type: string
        subGroupCount:
          format: int64
          type: integer
        subGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupRepresentation'
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        realmRoles:
          type: array
          items:
            type: string
        clientRoles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        access:
          type: object
          additionalProperties:
            type: boolean
    ManagementPermissionReference:
      type: object
      properties:
        enabled:
          type: boolean
        resource:
          type: string
        scopePermissions:
          type: object
          additionalProperties:
            type: string
    UserRepresentation:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        attributes:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        userProfileMetadata:
          $ref: '#/components/schemas/UserProfileMetadata'
        enabled:
          type: boolean
        self:
          type: string
        origin:
          type: string
        createdTimestamp:
          format: int64
          type: integer
        totp:
          type: boolean
        federationLink:
          type: string
        serviceAccountClientId:
          type: string
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRepresentation'
        disableableCredentialTypes:
          uniqueItems: true
          type: array
          items:
            type: string
        requiredActions:
          type: array
          items:
            type: string
        federatedIdentities:
          type: array
          items:
            $ref: '#/components/schemas/FederatedIdentityRepresentation'
        realmRoles:
          type: array
          items:
            type: string
        clientRoles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        clientConsents:
          type: array
          items:
            $ref: '#/components/schemas/UserConsentRepresentation'
        notBefore:
          format: int32
          type: integer
        verifiableCredentials:
          type: array
          items:
            $ref: '#/components/schemas/UserVerifiableCredentialRepresentation'
        issuedVerifiableCredentials:
          type: array
          items:
            $ref: '#/components/schemas/IssuedVerifiableCredentialRepresentation'
        applicationRoles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          deprecated: true
        socialLinks:
          type: array
          items:
            $ref: '#/components/schemas/SocialLinkRepresentation'
          deprecated: true
        groups:
          type: array
          items:
            type: string
        access:
          type: object
          additionalProperties:
            type: boolean
    SocialLinkRepresentation:
      type: object
      properties:
        socialProvider:
          type: string
        socialUserId:
          type: string
        socialUsername:
          type: string
    FederatedIdentityRepresentation:
      type: object
      properties:
        identityProvider:
          type: string
        userId:
          type: string
        userName:
          type: string
