          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentRepresentation'
      summary: Get admin realms by realm components
      x-summary-source: derived
      operationId: getAdminRealmsByRealmComponents
      x-operation-id-source: derived
    post:
