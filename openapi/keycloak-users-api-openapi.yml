openapi: 3.2.0
info:
  title: Keycloak Admin REST Users API
  description: This is a REST API reference for the Keycloak Admin REST API.
  version: '1.0'
tags:
- name: Users
paths:
  /admin/realms/{realm}/users:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Users
      summary: Get users Returns a stream of users, filtered according to query parameters
      description: Returns a stream of users. Note that the 'credentials' field in the returned UserRepresentation objects is typically not populated for performance reasons. If specific credential metadata is required, use the dedicated 'GET /admin/realms/{realm}/users/{user-id}/credentials' endpoint.
      parameters:
      - name: briefRepresentation
        in: query
        description: 'Boolean which defines whether brief representations are returned (default: false)'
        schema:
          type: boolean
      - name: createdAfter
        in: query
        description: Only return users created after (inclusive) the given date, in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds
        schema:
          type: string
      - name: createdBefore
        in: query
        description: Only return users created before (inclusive) the given date, in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds
        schema:
          type: string
      - name: email
        in: query
        description: A String contained in email, or the complete email, if param "exact" is true
        schema:
          type: string
      - name: emailVerified
        in: query
        description: whether the email has been verified
        schema:
          type: boolean
      - name: enabled
        in: query
        description: Boolean representing if user is enabled or not
        schema:
          type: boolean
      - name: exact
        in: query
        description: Boolean which defines whether the params "last", "first", "email" and "username" must match exactly
        schema:
          type: boolean
      - name: first
        in: query
        description: Pagination offset
        schema:
          format: int32
          type: integer
      - name: firstName
        in: query
        description: A String contained in firstName, or the complete firstName, if param "exact" is true
        schema:
          type: string
      - name: idpAlias
        in: query
        description: The alias of an Identity Provider linked to the user
        schema:
          type: string
      - name: idpUserId
        in: query
        description: The userId at an Identity Provider linked to the user
        schema:
          type: string
      - name: lastName
        in: query
        description: A String contained in lastName, or the complete lastName, if param "exact" is true
        schema:
          type: string
      - name: max
        in: query
        description: Maximum results size (defaults to 100)
        schema:
          format: int32
          type: integer
      - name: q
        in: query
        description: A query to search for custom attributes, in the format 'key1:value2 key2:value2'
        schema:
          type: string
      - name: search
        in: query
        description: A String contained in username, first or last name, or email. Default search behavior is prefix-based (e.g., foo or foo*). Use *foo* for infix search and "foo" for exact search.
        schema:
          type: string
      - name: username
        in: query
        description: A String contained in username, or the complete username, if param "exact" is true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmUsers
      x-operation-id-source: derived
    post:
      tags:
      - Users
      summary: Create a new user Username must be unique
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content: {}
        '403':
          description: Forbidden
        '409':
          description: Conflict
          content: {}
        '500':
          description: Internal Server Error
          content: {}
      operationId: postAdminRealmsByRealmUsers
      x-operation-id-source: derived
  /admin/realms/{realm}/users/count:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Users
      summary: Returns the number of users that match the given criteria
      description: 'It can be called in three different ways. 1. Don’t specify any criteria and pass {@code null}. The number of all users within that realm will be returned.

        2. If {@code search} is specified other criteria such as {@code last} will be ignored even though you set them. The {@code search} string will be matched against the first and last name, the username and the email of a user.

        3. If {@code search} is unspecified but any of {@code last}, {@code first}, {@code email} or {@code username} those criteria are matched against their respective fields on a user entity. Combined with a logical and.'
      parameters:
      - name: createdAfter
        in: query
        description: Only return users created after (inclusive) the given date, in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds
        schema:
          type: string
      - name: createdBefore
        in: query
        description: Only return users created before (inclusive) the given date, in ISO-8601 format (yyyy-MM-dd) or epoch milliseconds
        schema:
          type: string
      - name: email
        in: query
        description: A String contained in email, or the complete email, if param "exact" is true
        schema:
          type: string
      - name: emailVerified
        in: query
        description: whether the email has been verified
        schema:
          type: boolean
      - name: enabled
        in: query
        description: Boolean representing if user is enabled or not
        schema:
          type: boolean
      - name: exact
        in: query
        description: Boolean which defines whether the params "last", "first", "email" and "username" must match exactly
        schema:
          type: boolean
      - name: firstName
        in: query
        description: A String contained in firstName, or the complete firstName, if param "exact" is true
        schema:
          type: string
      - name: idpAlias
        in: query
        description: The alias of an Identity Provider linked to the user
        schema:
          type: string
      - name: idpUserId
        in: query
        description: The userId at an Identity Provider linked to the user
        schema:
          type: string
      - name: lastName
        in: query
        description: A String contained in lastName, or the complete lastName, if param "exact" is true
        schema:
          type: string
      - name: q
        in: query
        description: A query to search for custom attributes, in the format 'key1:value2 key2:value2'
        schema:
          type: string
      - name: search
        in: query
        description: A String contained in username, first or last name, or email. Default search behavior is prefix-based (e.g., foo or foo*). Use *foo* for infix search and "foo" for exact search.
        schema:
          type: string
      - name: username
        in: query
        description: A String contained in username, or the complete username, if param "exact" is true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                format: int32
                type: integer
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmUsersCount
      x-operation-id-source: derived
