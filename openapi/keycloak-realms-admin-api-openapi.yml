openapi: 3.2.0
info:
  title: Keycloak Admin REST Realms Admin API
  description: This is a REST API reference for the Keycloak Admin REST API.
  version: '1.0'
tags:
- name: Realms Admin
paths:
  /admin/realms:
    get:
      tags:
      - Realms Admin
      summary: Get accessible realms Returns a list of accessible realms.
      parameters:
      - name: briefRepresentation
        in: query
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RealmRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealms
      x-operation-id-source: derived
    post:
      tags:
      - Realms Admin
      summary: Import a realm. Imports a realm from a full representation of that realm
      description: Realm name must be unique.
      requestBody:
        content:
          application/json:
            schema:
              format: binary
              type: string
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
      operationId: postAdminRealms
      x-operation-id-source: derived
  /admin/realms/{realm}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Realms Admin
      summary: Get the top-level representation of the realm It will not include nested…
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealmRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealm
      x-operation-id-source: derived
    put:
      tags:
      - Realms Admin
      summary: Update the top-level information of the realm Any user, roles or client…
      description: This will only update top-level attributes of the realm.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealmRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Conflict
        '500':
          description: Internal Server Error
      operationId: putAdminRealmsByRealm
      x-operation-id-source: derived
    delete:
      tags:
      - Realms Admin
      summary: Delete the realm
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: deleteAdminRealmsByRealm
      x-operation-id-source: derived
  /admin/realms/{realm}/admin-events:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Realms Admin
      summary: Get admin events Returns all admin events, or filters events based on URL query…
      parameters:
      - name: authClient
        in: query
        schema:
          type: string
      - name: authIpAddress
        in: query
        schema:
          type: string
      - name: authRealm
        in: query
        schema:
          type: string
      - name: authUser
        in: query
        description: user id
        schema:
          type: string
      - name: dateFrom
        in: query
        description: From (inclusive) date (yyyy-MM-dd) or time in Epoch timestamp millis (number of milliseconds since January 1, 1970, 00:00:00 GMT)
        schema:
          type: string
      - name: dateTo
        in: query
        description: To (inclusive) date (yyyy-MM-dd) or time in Epoch timestamp millis (number of milliseconds since January 1, 1970, 00:00:00 GMT)
        schema:
          type: string
      - name: direction
        in: query
        description: The direction to sort events by (asc or desc)
        schema:
          type: string
      - name: first
        in: query
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: Maximum results size (defaults to 100)
        schema:
          format: int32
          type: integer
      - name: operationTypes
        in: query
        schema:
          type: array
          items:
            type: string
      - name: resourcePath
        in: query
        schema:
          type: string
      - name: resourceTypes
        in: query
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEventRepresentation'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmAdminEvents
      x-operation-id-source: derived
    delete:
      tags:
      - Realms Admin
      summary: Delete all admin events
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
      operationId: deleteAdminRealmsByRealmAdminEvents
      x-operation-id-source: derived
  /admin/realms/{realm}/client-description-converter:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    post:
      tags:
      - Realms Admin
      summary: Base path for importing clients under this realm
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
