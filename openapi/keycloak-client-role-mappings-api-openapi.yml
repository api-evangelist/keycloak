    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    - name: client-id
      in: path
      description: client id (not clientId!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Client Role Mappings
      summary: Get available client-level roles that can be mapped to the user or group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleRepresentation'
      operationId: getAdminRealmsByRealmGroupsByGroupIdRoleMappingsClientsByClientIdAvailable
      x-operation-id-source: derived
  /admin/realms/{realm}/groups/{group-id}/role-mappings/clients/{client-id}/composite:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
