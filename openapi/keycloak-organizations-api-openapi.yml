openapi: 3.2.0
info:
  title: Keycloak Admin REST Organizations API
  description: This is a REST API reference for the Keycloak Admin REST API.
  version: '1.0'
tags:
- name: Organizations
  x-smallrye-profile-admin: ''
paths:
  /admin/realms/{realm}/organizations:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns a paginated list of organizations filtered according to the specified…
      parameters:
      - name: briefRepresentation
        in: query
        description: if false, return the full representation. Otherwise, only the basic fields are returned.
        schema:
          default: true
          type: boolean
      - name: exact
        in: query
        description: Boolean which defines whether the param 'search' must match exactly or not
        schema:
          type: boolean
      - name: first
        in: query
        description: The position of the first result to be processed (pagination offset)
        schema:
          format: int32
          default: '0'
          type: integer
      - name: identityProvider
        in: query
        description: The alias of an identity provider, to only return the organizations linked to it. Cannot be combined with 'q'
        schema:
          type: string
      - name: max
        in: query
        description: The maximum number of results to be returned - defaults to 10
        schema:
          format: int32
          default: '10'
          type: integer
      - name: q
        in: query
        description: A query to search for custom attributes, in the format 'key1:value2 key2:value2'
        schema:
          type: string
      - name: search
        in: query
        description: A String representing either an organization name or domain
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getAdminRealmsByRealmOrganizations
      x-operation-id-source: derived
    post:
      tags:
      - Organizations
      summary: Creates a new organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '403':
          description: Forbidden
      operationId: postAdminRealmsByRealmOrganizations
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/count:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns the organizations counts
      parameters:
      - name: exact
        in: query
        description: Boolean which defines whether the param 'search' must match exactly or not
        schema:
          type: boolean
      - name: identityProvider
        in: query
        description: The alias of an identity provider, to only count the organizations linked to it. Cannot be combined with 'q'
        schema:
          type: string
      - name: q
        in: query
        description: A query to search for custom attributes, in the format 'key1:value2 key2:value2'
        schema:
          type: string
      - name: search
        in: query
        description: A String representing either an organization name or domain
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                format: int64
                type: integer
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsCount
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/members/{member-id}/organizations:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns the organizations associated with the user that has the specified id
      parameters:
      - name: member-id
        in: path
        required: true
        schema:
          type: string
      - name: briefRepresentation
        in: query
        description: if false, return the full representation. Otherwise, only the basic fields are returned.
        schema:
          default: true
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationRepresentation'
        '400':
          description: Bad Request
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsMembersByMemberIdOrganizations
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns the organization representation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgId
      x-operation-id-source: derived
    put:
      tags:
      - Organizations
      summary: Updates the organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
      operationId: putAdminRealmsByRealmOrganizationsByOrgId
      x-operation-id-source: derived
    delete:
      tags:
      - Organizations
      summary: Deletes the organization
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
      operationId: deleteAdminRealmsByRealmOrganizationsByOrgId
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get organization groups
      description: Returns organization groups. When `search` parameter is provided, groups are searched by name. When `q` parameter is provided, groups are searched by attributes. If neither parameter is provided, top-level groups are returned.
      parameters:
      - name: briefRepresentation
        in: query
        schema:
          default: true
          type: boolean
      - name: exact
        in: query
        schema:
          default: 'false'
          type: boolean
      - name: first
        in: query
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        schema:
          format: int32
          type: integer
      - name: populateHierarchy
        in: query
        schema:
          default: false
          type: boolean
      - name: q
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: subGroupsCount
        in: query
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdGroups
      x-operation-id-source: derived
    post:
      tags:
      - Organizations
      summary: Creates a new top-level group or moves an existing group to top-level
      description: Creates a new top-level group in the organization. If the group representation includes an ID, moves the existing organization group to be a top-level group. If no ID is provided, creates a new top-level group.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '201':
          description: Created
        '204':
          description: No Content - Group moved to top-level
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found - Group does not exist
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmOrganizationsByOrgIdGroups
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups/group-by-path/{path}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get organization group by path
      description: Returns the organization group with the specified path
      parameters:
      - name: path
        in: path
        required: true
        schema:
          pattern: .*
          type: string
      - name: briefRepresentation
        in: query
        description: 'Whether to return a brief representation (default: true)'
        schema:
          default: true
          type: boolean
      - name: subGroupsCount
        in: query
        description: 'Whether to return the count of subgroups (default: false)'
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdGroupsGroupByPathByPath
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups/{group-id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get organization group representation
      parameters:
      - name: subGroupsCount
        in: query
        description: 'Whether to return the count of subgroups (default: false)'
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupId
      x-operation-id-source: derived
    put:
      tags:
      - Organizations
      summary: Update organization group
      description: Updates the organization group's name, description, and attributes. Subgroups are not affected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
      operationId: putAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupId
      x-operation-id-source: derived
    delete:
      tags:
      - Organizations
      summary: Delete the organization group
      description: Deletes the organization group and all its subgroups
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: deleteAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupId
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups/{group-id}/children:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get subgroups of this organization group
      description: Returns a paginated stream of subgroups that belong to this organization group
      parameters:
      - name: exact
        in: query
        description: Boolean which defines whether the params "search" must match exactly or not
        schema:
          type: boolean
      - name: first
        in: query
        description: The position of the first result to be returned (pagination offset).
        schema:
          format: int32
          default: '0'
          type: integer
      - name: max
        in: query
        description: The maximum number of results that are to be returned. Defaults to 10
        schema:
          format: int32
          default: '10'
          type: integer
      - name: search
        in: query
        description: A String representing either an exact group name or a partial name
        schema:
          type: string
      - name: subGroupsCount
        in: query
        description: 'Whether to return the count of subgroups (default: false)'
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupIdChildren
      x-operation-id-source: derived
    post:
      tags:
      - Organizations
      summary: Create or move a subgroup
      description: Creates a new subgroup under this organization group. If the group representation includes an ID, moves the existing group to be a child of this group. If no ID is provided, creates a new subgroup.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRepresentation'
      responses:
        '201':
          description: Created
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupIdChildren
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups/{group-id}/members:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get members of this organization group
      description: Returns a paginated list of organization members that belong to this group
      parameters:
      - name: briefRepresentation
        in: query
        description: Only return basic information (only guaranteed to return id, username, created, first and last name, email, enabled state, email verification state, federation link, and access. Note that it means that namely user attributes, required actions, and not before are not returned.)
        schema:
          type: boolean
      - name: first
        in: query
        description: Pagination offset
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: Maximum results size (defaults to 100)
        schema:
          format: int32
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupIdMembers
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/groups/{group-id}/members/{userId}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    - name: group-id
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - Organizations
      summary: Add a user to this organization group
      description: Adds an organization member to this group. The user must be a member of the organization.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request - User is not a member of the organization
        '403':
          description: Forbidden
        '404':
          description: Not Found - User does not exist
        '409':
          description: Conflict - User is already a member of the group
      operationId: putAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupIdMembersByUserId
      x-operation-id-source: derived
    delete:
      tags:
      - Organizations
      summary: Remove a user from this organization group
      description: Removes a user from this organization group. The user remains a member of the organization.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found - User does not exist
      operationId: deleteAdminRealmsByRealmOrganizationsByOrgIdGroupsByGroupIdMembersByUserId
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/identity-providers:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns all identity providers associated with the organization
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdIdentityProviders
      x-operation-id-source: derived
    post:
      tags:
      - Organizations
      summary: Adds the identity provider with the specified id to the organization
      description: Adds, or associates, an existing identity provider with the organization. If no identity provider is found, or if it is already associated with the organization, an error response is returned
      requestBody:
        description: Payload should contain only id or alias of the identity provider to be associated with the organization (id or alias with or without quotes). Surrounding whitespace characters will be trimmed.
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmOrganizationsByOrgIdIdentityProviders
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/identity-providers/{alias}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns the identity provider associated with the organization that has the…
      description: Searches for an identity provider with the given alias. If one is found and is associated with the organization, it is returned. Otherwise, an error response with status NOT_FOUND is returned
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdIdentityProvidersByAlias
      x-operation-id-source: derived
    put:
      tags:
      - Organizations
      summary: Updates the per-association config for the identity provider linked to the…
      description: Updates the autoMembership and membershipType settings for the link between the organization and the identity provider with the given alias. If the provider is not linked to the organization, a NOT_FOUND error is returned
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationIdentityProviderLinkRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: putAdminRealmsByRealmOrganizationsByOrgIdIdentityProvidersByAlias
      x-operation-id-source: derived
    delete:
      tags:
      - Organizations
      summary: Removes the identity provider with the specified alias from the organization
      description: Breaks the association between the identity provider and the organization. The provider itself is not deleted. If no provider is found, or if it is not currently associated with the org, an error response is returned
      parameters:
      - name: alias
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: deleteAdminRealmsByRealmOrganizationsByOrgIdIdentityProvidersByAlias
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/identity-providers/{alias}/groups:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Returns organization groups for the identity provider
      description: Returns organization groups that can be used in identity provider mappers. Only returns groups if the identity provider is associated with the organization.
      parameters:
      - name: alias
        in: path
        description: The alias of the identity provider
        required: true
        schema:
          type: string
      - name: briefRepresentation
        in: query
        description: If true, return brief representation; otherwise return full representation
        schema:
          default: true
          type: boolean
      - name: exact
        in: query
        description: If true, perform exact match on the search parameter
        schema:
          default: 'false'
          type: boolean
      - name: first
        in: query
        description: The position of the first result (pagination offset)
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: The maximum number of results to return
        schema:
          format: int32
          type: integer
      - name: q
        in: query
        description: A query to search for group attributes, in the format 'key1:value1 key2:value2'
        schema:
          type: string
      - name: search
        in: query
        description: A string to search for in group names
        schema:
          type: string
      - name: subGroupsCount
        in: query
        description: If true, include subgroups count in the response
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdIdentityProvidersByAliasGroups
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/invitations:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get invitations for the organization
      parameters:
      - name: email
        in: query
        schema:
          type: string
      - name: first
        in: query
        schema:
          format: int32
          type: integer
      - name: firstName
        in: query
        schema:
          type: string
      - name: lastName
        in: query
        schema:
          type: string
      - name: max
        in: query
        schema:
          format: int32
          type: integer
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationInvitationRepresentation'
        '403':
          description: Forbidden
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdInvitations
      x-operation-id-source: derived
  /admin/realms/{realm}/organizations/{org-id}/invitations/{id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: org-id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Organizations
      summary: Get invitation by ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitationRepresentation'
        '403':
          description: Forbidden
        '404':
          description: Not Found
      operationId: getAdminRealmsByRealmOrganizationsByOrgIdInvitationsById
      x-operation-id-source: derived
    delete:
