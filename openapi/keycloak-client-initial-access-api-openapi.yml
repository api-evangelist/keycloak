      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Client Initial Access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientInitialAccessPresentation'
      summary: Get admin realms by realm clients initial access
      x-summary-source: derived
      operationId: getAdminRealmsByRealmClientsInitialAccess
      x-operation-id-source: derived
    post:
      tags:
      - Client Initial Access
      summary: Create a new initial access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInitialAccessCreatePresentation'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientInitialAccessCreatePresentation'
      operationId: postAdminRealmsByRealmClientsInitialAccess
      x-operation-id-source: derived
  /admin/realms/{realm}/clients-initial-access/{id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    delete:
      tags:
      - Client Initial Access
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
