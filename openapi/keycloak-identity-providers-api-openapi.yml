openapi: 3.2.0
info:
  title: Keycloak Admin REST Identity Providers API
  description: This is a REST API reference for the Keycloak Admin REST API.
  version: '1.0'
tags:
- name: Identity Providers
paths:
  /admin/realms/{realm}/identity-provider/import-config:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    post:
      tags:
      - Identity Providers
      summary: Import identity provider from JSON body
      description: Import identity provider from uploaded JSON file
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      operationId: postAdminRealmsByRealmIdentityProviderImportConfig
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: List identity providers
      parameters:
      - name: briefRepresentation
        in: query
        description: 'Boolean which defines whether brief representations are returned (default: false)'
        schema:
          type: boolean
      - name: capability
        in: query
        description: Filter by identity providers capability
        schema:
          type: string
      - name: first
        in: query
        description: Pagination offset
        schema:
          format: int32
          type: integer
      - name: max
        in: query
        description: Maximum results size (defaults to 100)
        schema:
          format: int32
          type: integer
      - name: realmOnly
        in: query
        description: 'Boolean which defines if only realm-level IDPs (not associated with orgs) should be returned (default: false)'
        schema:
          type: boolean
      - name: search
        in: query
        description: Filter specific providers by name. Search can be prefix (name*), contains (*name*) or exact ("name"). Default prefixed.
        schema:
          type: string
      - name: type
        in: query
        description: Filter by identity providers type
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderRepresentation'
      operationId: getAdminRealmsByRealmIdentityProviderInstances
      x-operation-id-source: derived
    post:
      tags:
      - Identity Providers
      summary: Create a new identity provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '409':
          description: Conflict
      operationId: postAdminRealmsByRealmIdentityProviderInstances
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Get the identity provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderRepresentation'
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAlias
      x-operation-id-source: derived
    put:
      tags:
      - Identity Providers
      summary: Update the identity provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderRepresentation'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '409':
          description: Conflict
      operationId: putAdminRealmsByRealmIdentityProviderInstancesByAlias
      x-operation-id-source: derived
    delete:
      tags:
      - Identity Providers
      summary: Delete the identity provider
      responses:
        '200':
          description: OK
      operationId: deleteAdminRealmsByRealmIdentityProviderInstancesByAlias
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/export:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Export public broker configuration for identity provider
      parameters:
      - name: format
        in: query
        description: Format to use
        schema:
          type: string
      responses:
        '200':
          description: OK
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasExport
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/management/permissions:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Return object stating whether client Authorization permissions have been…
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasManagementPermissions
      x-operation-id-source: derived
    put:
      tags:
      - Identity Providers
      summary: Return object stating whether client Authorization permissions have been…
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagementPermissionReference'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementPermissionReference'
      operationId: putAdminRealmsByRealmIdentityProviderInstancesByAliasManagementPermissions
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/mapper-types:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Get mapper types for identity provider
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/IdentityProviderMapperTypeRepresentation'
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasMapperTypes
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/mappers:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Get mappers for identity provider
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasMappers
      x-operation-id-source: derived
    post:
      tags:
      - Identity Providers
      summary: Add a mapper to identity provider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      responses:
        '200':
          description: OK
      operationId: postAdminRealmsByRealmIdentityProviderInstancesByAliasMappers
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/mappers/{id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Get mapper by id for the identity provider
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasMappersById
      x-operation-id-source: derived
    put:
      tags:
      - Identity Providers
      summary: Update a mapper for the identity provider
      parameters:
      - name: id
        in: path
        description: Mapper id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityProviderMapperRepresentation'
      responses:
        '204':
          description: No Content
      operationId: putAdminRealmsByRealmIdentityProviderInstancesByAliasMappersById
      x-operation-id-source: derived
    delete:
      tags:
      - Identity Providers
      summary: Delete a mapper for the identity provider
      parameters:
      - name: id
        in: path
        description: Mapper id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      operationId: deleteAdminRealmsByRealmIdentityProviderInstancesByAliasMappersById
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/instances/{alias}/reload-keys:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    - name: alias
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Reaload keys for the identity provider if the provider supports it, "true" is…
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
      operationId: getAdminRealmsByRealmIdentityProviderInstancesByAliasReloadKeys
      x-operation-id-source: derived
  /admin/realms/{realm}/identity-provider/providers/{provider_id}:
    parameters:
    - name: realm
      in: path
      description: realm name (not id!)
      required: true
      schema:
        type: string
    get:
      tags:
      - Identity Providers
      summary: Get the identity provider factory for that provider id
      parameters:
      - name: provider_id
        in: path
        description: The provider id to get the factory
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      operationId: getAdminRealmsByRealmIdentityProviderProvidersByProviderId
      x-operation-id-source: derived
components:
  schemas:
    IdentityProviderRepresentation:
      type: object
      properties:
        alias:
          type: string
        displayName:
          type: string
        internalId:
          type: string
        providerId:
          type: string
        enabled:
          type: boolean
        updateProfileFirstLoginMode:
          type: string
          deprecated: true
        trustEmail:
          type: boolean
        storeToken:
          type: boolean
        addReadTokenRoleOnCreate:
          type: boolean
        authenticateByDefault:
          type: boolean
        linkOnly:
          type: boolean
        hideOnLogin:
          type: boolean
        firstBrokerLoginFlowAlias:
          type: string
        postBrokerLoginFlowAlias:
          type: string
        organizationLinks:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationIdentityProviderLinkRepresentation'
        config:
          type: object
          additionalProperties:
            type: string
        types:
          type: array
          items:
            type: string
        updateProfileFirstLogin:
          type: boolean
          deprecated: true
        organizationId:
          type: string
          writeOnly: true
          deprecated: true
    IdentityProviderMapperTypeRepresentation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        helpText:
          type: string
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ConfigPropertyRepresentation'
    ManagementPermissionReference:
      type: object
      properties:
        enabled:
          type: boolean
        resource:
          type: string
        scopePermissions:
          type: object
          additionalProperties:
            type: string
    ConfigPropertyRepresentation:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        helpText:
          type: string
        type:
          type: string
        defaultValue: {}
        options:
          type: array
          items:
            type: string
        secret:
          type: boolean
        required:
          type: boolean
        readOnly:
          type: boolean
    OrganizationIdentityProviderLinkRepresentation:
      type: object
      properties:
        organizationId:
          type: string
        autoMembership:
          type: boolean
        membershipType:
          type: string
    IdentityProviderMapperRepresentation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        identityProviderAlias:
          type: string
        identityProviderMapper:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
