        mapping: $.
    - name: getusers
      description: Keycloak List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: keycloak.getusers
      with:
        search: tools.search
        username: tools.username
        email: tools.email
        firstName: tools.firstName
        lastName: tools.lastName
        enabled: tools.enabled
        first: tools.first
        max: tools.max
        briefRepresentation: tools.briefRepresentation
      inputParameters:
      - name: search
        type: string
        description: Search string for username, first name, last name, or email
      - name: username
        type: string
        description: username
      - name: email
        type: string
        description: email
      - name: firstName
        type: string
        description: firstName
      - name: lastName
        type: string
        description: lastName
      - name: enabled
        type: boolean
        description: enabled
      - name: first
        type: integer
        description: Pagination offset
      - name: max
        type: integer
        description: Maximum results size
      - name: briefRepresentation
