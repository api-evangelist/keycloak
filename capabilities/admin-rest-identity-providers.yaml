    baseUri: https://{host}/admin/realms
    description: Keycloak Admin REST API — Identity Providers business capability. Self-contained, no shared references.
    resources:
    - name: realm-identity-provider-instances
      path: /{realm}/identity-provider/instances
      operations:
      - name: getidentityproviders
        method: GET
        description: Keycloak List identity providers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createidentityprovider
        method: POST
        description: Keycloak Create an identity provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: realm-identity-provider-instances-alias
      path: /{realm}/identity-provider/instances/{alias}
      operations:
      - name: getidentityprovider
        method: GET
        description: Keycloak Get an identity provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateidentityprovider
        method: PUT
        description: Keycloak Update an identity provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
