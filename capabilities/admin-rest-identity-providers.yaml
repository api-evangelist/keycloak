        mapping: $.
    - name: keycloak-get-identity-provider
      description: Keycloak Get an identity provider
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: admin-rest-identity-providers.getidentityprovider
      outputParameters:
      - type: object
        mapping: $.
    - name: keycloak-update-identity-provider
      description: Keycloak Update an identity provider
      hints:
