      - name: deleteidentityprovider
        method: DELETE
        description: Keycloak Delete an identity provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.KEYCLOAK_API_KEY}}'
  exposes:
  - type: rest
    namespace: admin-rest-identity-providers-rest
    port: 8080
    description: REST adapter for Keycloak Admin REST API — Identity Providers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/{realm}/identity-provider/instances
      name: realm-identity-provider-instances
      description: REST surface for realm-identity-provider-instances.
      operations:
      - method: GET
        name: getidentityproviders
        description: Keycloak List identity providers
        call: admin-rest-identity-providers.getidentityproviders
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createidentityprovider
        description: Keycloak Create an identity provider
        call: admin-rest-identity-providers.createidentityprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{realm}/identity-provider/instances/{alias}
      name: realm-identity-provider-instances-alias
      description: REST surface for realm-identity-provider-instances-alias.
      operations:
      - method: GET
        name: getidentityprovider
        description: Keycloak Get an identity provider
        call: admin-rest-identity-providers.getidentityprovider
        outputParameters:
        - type: object
