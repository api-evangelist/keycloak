naftiko: 1.0.0-alpha2
info:
  label: Keycloak Admin REST API — Identity Providers
  description: 'Keycloak Admin REST API — Identity Providers. 5 operations. Lead operation: Keycloak List identity providers.
    Self-contained Naftiko capability covering one Keycloak business surface.'
  tags:
  - Keycloak
  - Identity Providers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KEYCLOAK_API_KEY: KEYCLOAK_API_KEY
capability:
